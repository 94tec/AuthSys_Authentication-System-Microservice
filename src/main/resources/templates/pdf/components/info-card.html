
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="section(title, content)"
     style="
        width:100%;
        margin:20px 0 10px;
     ">

    <!-- Section heading -->
    <div style="
        background:#EEF2EA;
        color:#3F5D42;
        font-family:Helvetica,Arial,sans-serif;
        font-size:11px;
        font-weight:bold;
        text-transform:uppercase;
        letter-spacing:0.6px;
        padding:7px 10px;
        margin-bottom:10px;
     "
         th:text="${title}">

        Information

    </div>

    <!-- Section content -->
    <div th:replace="${content}"></div>

</div>

</body>
</html>
