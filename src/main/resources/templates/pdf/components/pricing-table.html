
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="pricing"
     style="width:100%; margin:20px 0;">

    <!-- Section heading -->
    <div style="
        background:#EEF2EA;
        color:#3F5D42;
        font-family:Helvetica,Arial,sans-serif;
        font-size:11px;
        font-weight:bold;
        text-transform:uppercase;
        letter-spacing:0.6px;
        padding:7px 10px;
        margin-bottom:10px;
    ">
        Pricing
    </div>

    <table width="100%"
           cellpadding="0"
           cellspacing="0"
           border="0"
           style="
               width:100%;
               border-collapse:collapse;
               font-family:Helvetica,Arial,sans-serif;
           ">

        <!-- Table header -->
        <thead>
        <tr style="
            background:#3F5D42;
            color:#FFFFFF;
        ">

            <th align="left"
                style="padding:9px 10px;font-size:10px;">
                Item
            </th>

            <th align="right"
                style="padding:9px 10px;font-size:10px;">
                Rate
            </th>

            <th align="center"
                style="padding:9px 10px;font-size:10px;">
                Qty
            </th>

            <th align="right"
                style="padding:9px 10px;font-size:10px;">
                Subtotal
            </th>

        </tr>
        </thead>

        <tbody>

        <!-- Adult pricing -->
        <tr>

            <td style="
                padding:9px 10px;
                border-bottom:1px solid #E2E2DC;
                font-size:11px;
            ">
                Adult
            </td>

            <td align="right"
                style="
                    padding:9px 10px;
                    border-bottom:1px solid #E2E2DC;
                    font-size:11px;
                    white-space:nowrap;
                "
                th:text="${q.currency + ' ' +
                    #numbers.formatDecimal(
                        q.pricePerAdult,1,'COMMA',2,'POINT'
                    )}">
            </td>

            <td align="center"
                style="
                    padding:9px 10px;
                    border-bottom:1px solid #E2E2DC;
                    font-size:11px;
                "
                th:text="${q.adultCount}">
            </td>

            <td align="right"
                style="
                    padding:9px 10px;
                    border-bottom:1px solid #E2E2DC;
                    font-size:11px;
                    white-space:nowrap;
                "
                th:text="${q.currency + ' ' +
                    #numbers.formatDecimal(
                        q.pricePerAdult.multiply(
                            new java.math.BigDecimal(q.adultCount)
                        ),1,'COMMA',2,'POINT'
                    )}">
            </td>

        </tr>

        <!-- Child pricing -->
        <tr th:if="${q.childCount != null and q.childCount > 0}">

            <td style="
                padding:9px 10px;
                border-bottom:1px solid #E2E2DC;
                font-size:11px;
            ">
                Child
            </td>

            <td align="right"
                style="
                    padding:9px 10px;
                    border-bottom:1px solid #E2E2DC;
                    font-size:11px;
                    white-space:nowrap;
                "
                th:text="${q.currency + ' ' +
                    #numbers.formatDecimal(
                        q.pricePerChild,1,'COMMA',2,'POINT'
                    )}">
            </td>

            <td align="center"
                style="
                    padding:9px 10px;
                    border-bottom:1px solid #E2E2DC;
                    font-size:11px;
                "
                th:text="${q.childCount}">
            </td>

            <td align="right"
                style="
                    padding:9px 10px;
                    border-bottom:1px solid #E2E2DC;
                    font-size:11px;
                    white-space:nowrap;
                "
                th:text="${q.currency + ' ' +
                    #numbers.formatDecimal(
                        q.pricePerChild.multiply(
                            new java.math.BigDecimal(q.childCount)
                        ),1,'COMMA',2,'POINT'
                    )}">
            </td>

        </tr>

        <!-- Total -->
        <tr>

            <td colspan="3"
                style="
                    padding:12px 10px;
                    border-top:2px solid #3F5D42;
                    font-size:12px;
                    font-weight:bold;
                    color:#3F5D42;
                ">
                Total Amount
            </td>

            <td align="right"
                style="
                    padding:12px 10px;
                    border-top:2px solid #3F5D42;
                    font-size:13px;
                    font-weight:bold;
                    color:#3F5D42;
                    white-space:nowrap;
                "
                th:text="${q.currency + ' ' +
                    #numbers.formatDecimal(
                        q.totalPrice,1,'COMMA',2,'POINT'
                    )}">
            </td>

        </tr>

        </tbody>

    </table>

    <!-- Inclusions -->
    <div th:if="${q.inclusionsNote != null
                  and !#strings.isEmpty(q.inclusionsNote)}"
         style="
            margin-top:12px;
            font-size:10.5px;
            line-height:1.6;
            color:#4A4A44;
        ">

        <strong style="color:#3F5D42;">
            Included in your safari:
        </strong>

        <span th:text="${q.inclusionsNote}"></span>

    </div>

</div>

</body>
</html>
