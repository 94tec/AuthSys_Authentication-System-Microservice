
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="signature"
     style="
        width:100%;
        margin:24px 0 20px;
        font-family:Helvetica,Arial,sans-serif;
     ">

    <!-- Closing message -->
    <p style="
        margin:0 0 16px;
        font-size:10.5px;
        line-height:1.7;
        color:#4A4A44;
    ">

        Thank you for choosing

        <strong style="color:#3F5D42;">
            Kivana Trails &amp; Safaris
        </strong>.

        We look forward to helping you experience
        an unforgettable safari adventure.

    </p>

    <!-- Company signature -->
    <div style="
        border-top:1px solid #E2E2DC;
        padding-top:14px;
    ">

        <p style="
            margin:0 0 4px;
            font-size:10px;
            color:#6B6B63;
        ">
            Warm regards,
        </p>

        <p style="
            margin:0 0 4px;
            font-size:13px;
            font-weight:bold;
            color:#3F5D42;
        ">
            Kivana Trails &amp; Safaris
        </p>

        <p style="
            margin:0;
            font-size:9.5px;
            line-height:1.6;
            color:#8A8A82;
        ">
            Explore Beyond Borders
        </p>

        <p style="
            margin:10px 0 0;
            font-size:9px;
            line-height:1.6;
            color:#8A8A82;
        ">

            Quotation Reference:

            <strong style="color:#3F5D42;"
                    th:text="${q.quoteId}">
            </strong>

        </p>

    </div>

</div>

</body>
</html>
