<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Payment Unsuccessful</title></head>
<body style="font-family:Arial,sans-serif;color:#0B1F1A;background:#F5F1E8;margin:0;padding:0;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F5F1E8;padding:32px 0;">
  <tr><td align="center">
    <table width="560" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:12px;overflow:hidden;border:1px solid #E8E2D4;">
      <tr><td style="background:#0B1F1A;padding:28px 32px;">
        <p style="color:#C9742F;font-size:20px;font-weight:bold;margin:0;">🌍 Damuchi Safaris</p>
      </td></tr>
      <tr><td style="padding:32px;">
        <h2 style="color:#8B2E2E;margin:0 0 8px;">Payment not completed</h2>
        <p style="color:#555;margin:0 0 16px;">Hi {{customerName}}, your M-Pesa payment was not completed successfully.</p>
        <p style="color:#666;font-size:13px;background:#fff8f8;border-left:4px solid #8B2E2E;padding:12px;border-radius:4px;margin-bottom:20px;">{{paymentFailureReason}}</p>
        <p style="color:#555;font-size:13px;">Your booking slot is still held. Please try again before it expires.</p>
        <a href="{{bookingPortalUrl}}" style="display:inline-block;background:#C9742F;color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:16px;">Try Again</a>
      </td></tr>
      <tr><td style="background:#F5F1E8;padding:20px 32px;text-align:center;border-top:1px solid #E8E2D4;">
        <p style="color:#888;font-size:12px;margin:0;"><a href="mailto:{{supportEmail}}" style="color:#C9742F;">{{supportEmail}}</a></p>
        <p style="color:#aaa;font-size:11px;margin:6px 0 0;">© {{companyName}}</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
