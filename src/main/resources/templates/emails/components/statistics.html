<!-- fragment args: items (list of maps with 'label' and 'value') -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" th:fragment="stats(items)" style="margin:20px 0;">
    <tr>
        <td th:each="item : ${items}" align="center" style="padding:14px 8px; background-color:#FFF8F3; border-radius:12px;">
            <div style="font-size:26px; font-weight:700; color:#FF6B35;" th:text="${item.value}">0</div>
            <div style="font-size:12px; color:#666666; text-transform:uppercase; letter-spacing:0.5px; margin-top:4px;" th:text="${item.label}">Label</div>
        </td>
    </tr>
</table>
