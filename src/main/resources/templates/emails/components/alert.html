<!-- fragment args: type ('success'|'danger'|'warning'|'info'), message -->
<div th:fragment="alert(type, message)"
     th:with="bg=${type == 'success' ? '#E8F5E9' : (type == 'danger' ? '#FDECEA' : (type == 'warning' ? '#FFF4E0' : '#EAF2FE'))},
              border=${type == 'success' ? '#43A047' : (type == 'danger' ? '#E53935' : (type == 'warning' ? '#F5A623' : '#2F80ED'))},
              icon=${type == 'success' ? '&#9989;' : (type == 'danger' ? '&#10060;' : (type == 'warning' ? '&#9888;&#65039;' : '&#8505;&#65039;')) }"
     th:style="'background-color:' + ${bg} + '; border-left:4px solid ' + ${border} + '; border-radius:10px; padding:16px 18px; margin:0 0 24px 0;'"
     style="background-color:#EAF2FE; border-left:4px solid #2F80ED; border-radius:10px; padding:16px 18px; margin:0 0 24px 0;">
    <span th:utext="${icon}">&#8505;&#65039;</span>
    <span th:text="${message}" th:style="'font-weight:600; color:' + ${border} + '; font-size:15px; margin-left:6px;'"
          style="font-weight:600; color:#2F80ED; font-size:15px; margin-left:6px;">Message</span>
</div>
