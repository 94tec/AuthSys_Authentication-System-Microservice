<!-- fragment arg: ticket (qrCodeUrl, ticketId, holderName, gate, seat) -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" th:fragment="ticket(ticket)"
       style="background:#FFFFFF; border:2px dashed #FF6F59; border-radius:14px; margin:16px 0;">
    <tr>
        <td align="center" style="padding:20px;">
            <img th:if="${ticket.qrCodeUrl != null}" th:src="@{${ticket.qrCodeUrl}}" alt="QR Ticket" style="width:140px; height:140px;" />
            <div style="font-size:16px; font-weight:700; color:#FF6B35; margin-top:10px;" th:text="'Ticket #' + ${ticket.ticketId}">Ticket #TCK-001</div>
            <div style="font-size:14px; color:#333333; margin-top:4px;" th:text="${ticket.holderName}">Jane Traveller</div>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:10px;">
                <tr>
                    <td style="padding:0 10px; font-size:12px; color:#666666;">Gate: <b th:text="${ticket.gate}" style="color:#333333;">A3</b></td>
                    <td style="padding:0 10px; font-size:12px; color:#666666;">Seat: <b th:text="${ticket.seat}" style="color:#333333;">14A</b></td>
                </tr>
            </table>
        </td>
    </tr>
</table>
