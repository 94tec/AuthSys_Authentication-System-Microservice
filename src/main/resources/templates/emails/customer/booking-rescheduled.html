<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/notification-template :: body(content=~{::#content})}">
<head><title>Booking Rescheduled</title></head>
<body>
    <div id="content">
        <div th:replace="~{emails/components/alert :: alert(type='info', message='Your booking dates have changed')}"></div>
        <div th:replace="~{emails/components/info-card :: info('Reschedule Details', ${detailRows})}"></div>
        <div style="text-align:center; margin:20px 0 0;">
            <div th:replace="~{emails/components/button :: button(text='View Updated Booking', url=${bookingUrl}, style='primary')}"></div>
        </div>
    </div>
</body>
</html>
