<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/notification-template :: body(content=~{::#content})}">
<head><title>Booking Cancelled</title></head>
<body>
    <div id="content">
        <div th:replace="~{emails/components/alert :: alert(type='warning', message='Your booking has been cancelled')}"></div>
        <div th:replace="~{emails/components/booking-card :: card(${booking})}"></div>
        <p style="font-size:14px; color:#666666;" th:text="${refundNote}">A refund of the eligible amount will be processed within 5-7 business days.</p>
        <div style="text-align:center; margin:20px 0 0;">
            <div th:replace="~{emails/components/button :: button(text='Browse New Trips', url=${browseUrl}, style='secondary')}"></div>
        </div>
    </div>
</body>
</html>
