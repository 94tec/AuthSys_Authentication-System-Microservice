<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/notification-template :: body(content=~{::#content})}">
<head><title>Payment Received</title></head>
<body>
    <div id="content">
        <div th:replace="~{emails/components/alert :: alert(type='success', message='Payment received — thank you!')}"></div>
        <div th:replace="~{emails/components/payment-summary :: summary(${payment})}"></div>
        <div style="text-align:center; margin:20px 0 0;">
            <div th:replace="~{emails/components/button :: button(text='View Receipt', url=${receiptUrl}, style='primary')}"></div>
        </div>
    </div>
</body>
</html>
