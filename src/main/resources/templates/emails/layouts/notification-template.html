<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${subject}">Damuchi Notification</title>
    <style>
        body { background-color:#FFF8F3; font-family:'Segoe UI', Helvetica, Arial, sans-serif; margin:0; padding:20px 0; }
        .container { max-width:600px; margin:0 auto; padding:20px; }
        .content { background-color:#FFFFFF; border-radius:16px; padding:32px 28px; box-shadow:0 8px 30px rgba(0,0,0,0.05); }
        @media screen and (max-width: 600px) {
            .container { padding: 12px !important; }
            .content { padding: 22px 18px !important; }
        }
    </style>
</head>
<body style="background-color:#FFF8F3; font-family:'Segoe UI', Helvetica, Arial, sans-serif; margin:0; padding:20px 0;" th:fragment="body(content)">
    <div class="container" style="max-width:600px; margin:0 auto; padding:20px;">
        <div th:replace="~{emails/partials/preheader}"></div>

        <!-- Compact top bar instead of full hero header -->
        <div th:replace="~{emails/partials/header}"></div>

        <div class="content" style="background-color:#FFFFFF; border-radius:16px; padding:32px 28px; box-shadow:0 8px 30px rgba(0,0,0,0.05);">
            <th:block th:remove="tag" th:replace="${content}"></th:block>
        </div>

        <p style="font-size:12px; color:#999999; text-align:center; margin:20px 0 0;">
            &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> Damuchi. Automated notification — please do not reply.
        </p>
    </div>
</body>
</html>
