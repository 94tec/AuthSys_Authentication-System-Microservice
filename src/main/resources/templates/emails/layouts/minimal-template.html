<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8"/>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <meta name="color-scheme"
          content="light"/>

    <meta name="supported-color-schemes"
          content="light"/>

    <title th:text="${subject}">
        Damuchi Notification
    </title>

    <style>

        body {
            background-color:#FFF8F3;
            font-family:'Segoe UI', Helvetica, Arial, sans-serif;
            margin:0;
            padding:20px;
        }

        .card {
            max-width:600px;
            margin:0 auto;
            background-color:#FFFFFF;
            border-radius:16px;
            padding:40px 30px;
            box-shadow:0 8px 30px rgba(0,0,0,0.05);
        }

        @media screen and (max-width:600px) {

            .card {
                padding:24px 18px !important;
                border-radius:12px !important;
            }

        }

    </style>

</head>


<body style="
    background-color:#FFF8F3;
    font-family:'Segoe UI', Helvetica, Arial, sans-serif;
    margin:0;
    padding:20px;
"
      th:fragment="body(content)">


<div class="card"
     style="
        max-width:600px;
        margin:0 auto;
        background-color:#FFFFFF;
        border-radius:16px;
        padding:40px 30px;
        box-shadow:0 8px 30px rgba(0,0,0,0.05);
     ">


    <!-- Preheader -->

    <div th:replace="~{emails/partials/preheader}"></div>


    <!-- Logo -->

    <div th:replace="~{emails/partials/header}"></div>


    <!-- Content -->

    <th:block
            th:remove="tag"
            th:replace="${content}">
    </th:block>


    <!-- Footer -->

    <div th:replace="~{emails/partials/footer}"></div>


    <!-- Copyright -->

    <div th:replace="~{emails/partials/copyright}"></div>


</div>

</body>
</html>
