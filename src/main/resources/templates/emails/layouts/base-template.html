<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8"/>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <meta name="color-scheme"
          content="light"/>

    <meta name="supported-color-schemes"
          content="light"/>

    <title th:text="${subject}">
        Damuchi Email
    </title>

    <style>

        body {
            background-color:#FFF8F3;
            font-family:'Segoe UI', Helvetica, Arial, sans-serif;
            margin:0;
            padding:20px 0;
        }

        .container {
            max-width:600px;
            margin:0 auto;
            padding:20px;
        }

        .content {
            background-color:#FFFFFF;
            border-radius:16px;
            padding:40px 30px;
            box-shadow:0 8px 30px rgba(0,0,0,0.05);
        }

        @media screen and (max-width:600px) {

            .container {
                padding:12px !important;
            }

            .content {
                padding:28px 20px !important;
                border-radius:12px !important;
            }

            .cta-button {
                display:block !important;
                width:100% !important;
                text-align:center !important;
            }

        }

    </style>

</head>


<body
        style="
        background-color:#FFF8F3;
        font-family:'Segoe UI', Helvetica, Arial, sans-serif;
        margin:0;
        padding:20px 0;
    "
        th:fragment="body(content)">


<div class="container"
     style="
        max-width:600px;
        margin:0 auto;
        padding:20px;
     ">


    <!-- Preheader -->
    <div th:replace="~{emails/partials/preheader}"></div>


    <!-- Logo Header -->
    <div th:replace="~{emails/partials/header}"></div>


    <!-- Main Content -->
    <div class="content"
         style="
            background-color:#FFFFFF;
            border-radius:16px;
            padding:40px 30px;
            box-shadow:0 8px 30px rgba(0,0,0,0.05);
         ">

        <th:block
                th:remove="tag"
                th:replace="${content}">
        </th:block>

    </div>


    <!-- Footer -->
    <div th:replace="~{emails/partials/footer}"></div>


    <!-- Copyright -->
    <div th:replace="~{emails/partials/copyright}"></div>


</div>

</body>
</html>
