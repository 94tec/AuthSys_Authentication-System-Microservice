<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/notification-template :: body(content=~{::#content})}">
<head><title>Approval Decision Recorded</title></head>
<body>
    <div id="content">
        <div th:replace="~{emails/components/alert :: alert(type=${approved ? 'success' : 'danger'}, message=${approved ? 'Approval completed' : 'Application rejected'})}"></div>
        <div th:replace="~{emails/components/info-card :: info('Decision Details', ${detailRows})}"></div>
    </div>
</body>
</html>
