<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/notification-template :: body(content=~{::#content})}">
<head><title>Security Alert</title></head>
<body>
    <div id="content">
        <div th:replace="~{emails/components/alert :: alert(type='danger', message='Suspicious activity detected')}"></div>
        <p style="font-size:16px; color:#333333;">
            We detected a login from an unrecognized IP address.
            Details: <span th:text="${ipAddress}">192.168.1.1</span> at <span th:text="${#dates.format(timestamp, 'yyyy-MM-dd HH:mm')}">now</span>.
        </p>
        <p style="font-size:16px; color:#333333;">If this wasn't you, secure your account immediately.</p>
        <div style="text-align:center; margin:24px 0 0;">
            <div th:replace="~{emails/components/button :: button(text='Review Activity', url=${activityUrl}, style='danger')}"></div>
        </div>
    </div>
</body>
</html>
