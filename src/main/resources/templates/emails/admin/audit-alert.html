<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/notification-template :: body(content=~{::#content})}">
<head><title>Audit Event</title></head>
<body>
    <div id="content">
        <div th:replace="~{emails/components/alert :: alert(type='warning', message='Audit event logged')}"></div>
        <div th:replace="~{emails/components/info-card :: info('Event Details', ${detailRows})}"></div>
        <div style="text-align:center; margin:16px 0 0;">
            <div th:replace="~{emails/components/button :: button(text='View Audit Log', url=${auditLogUrl}, style='secondary')}"></div>
        </div>
    </div>
</body>
</html>
