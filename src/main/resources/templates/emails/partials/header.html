<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="header"
     style="
        width:100%;
        text-align:center;
        padding:20px 12px 24px;
        box-sizing:border-box;
     ">

    <a th:if="${logoUrl != null
                 and !#strings.isEmpty(logoUrl)}"
       th:href="${baseUrl}"
       style="
          display:inline-block;
          text-decoration:none;
          border:0;
       ">

        <img th:src="${logoUrl}"
             alt="Kivana Trails and Safaris"
             width="180"
             style="
                display:block;
                width:180px;
                max-width:100%;
                height:auto;
                margin:0 auto;
                border:0;
                outline:none;
                text-decoration:none;
             "/>

    </a>

    <!-- Text fallback -->
    <div th:unless="${logoUrl != null
                     and !#strings.isEmpty(logoUrl)}"
         style="
            font-family:Arial,Helvetica,sans-serif;
            font-size:24px;
            font-weight:700;
            line-height:1.3;
            color:#174321;
            text-align:center;
         ">

        KIVANA

        <div style="
            margin-top:5px;
            font-size:13px;
            font-weight:400;
            letter-spacing:1px;
            color:#a66a20;
         ">
            Trails and Safaris
        </div>

    </div>

</div>

</body>
</html>
