<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/base-template :: body(content=~{::#content})}">
<head>
    <title th:text="${subject}">Password Expiry Warning</title>
</head>
<body>
<div id="content">
    <!-- Warning Alert -->
    <div th:replace="~{emails/components/alert :: alert(type='warning', message=#{email.password.warning.alert}(${daysRemaining}))}"></div>

    <p style="font-size:16px; line-height:1.7; color:#333333;">
        <span th:text="#{email.password.warning.greeting}">Hello</span> <span th:text="${fullName}">there</span>,
    </p>
    <p style="font-size:16px; line-height:1.7; color:#333333;" th:text="#{email.password.warning.body}(${daysRemaining})">
        Your password will expire in X days. Please update it soon.
    </p>

    <!-- Action Steps Card -->
    <div style="background:#F9F9F9; border-radius:12px; padding:20px; margin:20px 0; border-left:4px solid #FF6B35;">
        <h4 style="font-size:16px; color:#FF6B35; margin:0 0 10px;" th:text="#{email.password.warning.actions.title}">How to change your password</h4>
        <ol style="font-size:15px; color:#444444; line-height:1.8; padding-left:20px; margin:0;">
            <li th:text="#{email.password.warning.actions.step1}">Log in to your account</li>
            <li th:text="#{email.password.warning.actions.step2}">Go to Security Settings</li>
            <li th:text="#{email.password.warning.actions.step3}">Select "Change Password"</li>
        </ol>
    </div>

    <!-- CTA Button -->
    <div style="text-align:center; margin:30px 0;">
        <div th:replace="~{emails/components/button :: button(text=#{email.password.warning.button}, url=${changePasswordUrl})}"></div>
    </div>

    <!-- Footer info -->
    <p style="font-size:14px; color:#999999; text-align:center;">
        <span th:text="#{email.password.warning.sentAt} + ' ' + ${#dates.format(currentDate, 'MMMM dd, yyyy HH:mm z')}">Sent at: 2025-01-01 12:00</span>
    </p>

    <div th:replace="~{emails/components/support-card}"></div>
    <div th:replace="~{emails/components/signature}"></div>
</div>
</body>
</html>
