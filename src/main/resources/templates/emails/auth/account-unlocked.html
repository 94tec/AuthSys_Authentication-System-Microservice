<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/notification-template :: body(content=~{::#content})}">
<head><title>Account Reactivated</title></head>
<body>
    <div id="content">
        <div th:replace="~{emails/components/alert :: alert(type='success', message='Your account has been reactivated')}"></div>
        <p style="font-size:15px; color:#333333;">You have full access to your Damuchi account again.</p>
        <div style="text-align:center; margin:20px 0 0;">
            <div th:replace="~{emails/components/button :: button(text='Log In', url=${loginUrl}, style='primary')}"></div>
        </div>
    </div>
</body>
</html>
