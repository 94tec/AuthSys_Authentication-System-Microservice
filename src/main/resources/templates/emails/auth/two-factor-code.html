<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/minimal-template :: body(content=~{::#content})}">
<head><title>Your Verification Code</title></head>
<body>
    <div id="content">
        <h2 style="font-size:22px; color:#FF6B35; margin-top:0; text-align:center;">Your Verification Code</h2>
        <p style="font-size:14px; color:#666666; text-align:center; margin-bottom:20px;" th:text="'For: ' + ${purpose}">For: Login</p>
        <div style="text-align:center; background:#FFF8F3; border:1px dashed #FF6F59; border-radius:12px; padding:20px; margin:0 0 20px;">
            <span style="font-family:'Courier New', monospace; font-size:34px; font-weight:700; letter-spacing:10px; color:#FF6B35;" th:text="${otp}">123456</span>
        </div>
        <p style="font-size:13px; color:#999999; text-align:center;">This code expires in 10 minutes. Never share it with anyone.</p>
    </div>
</body>
</html>
