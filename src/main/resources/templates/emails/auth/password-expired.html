<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/base-template :: body(content=~{::#content})}">
<head>
    <title th:text="${subject}">Password Expired</title>
</head>
<body>
<div id="content">
    <!-- Danger Alert -->
    <div th:replace="~{emails/components/alert :: alert(type='danger', message=#{email.password.expired.alert}(${daysExpired}))}"></div>

    <p style="font-size:16px; line-height:1.7; color:#333333;">
        <span th:text="#{email.password.expired.greeting}">Hello</span> <span th:text="${fullName}">there</span>,
    </p>
    <p style="font-size:16px; line-height:1.7; color:#333333;" th:text="#{email.password.expired.body}(${daysExpired})">
        Your password expired X days ago. You must reset it immediately.
    </p>

    <!-- Reset Steps Card -->
    <div style="background:#F9F9F9; border-radius:12px; padding:20px; margin:20px 0; border-left:4px solid #E53935;">
        <h4 style="font-size:16px; color:#E53935; margin:0 0 10px;" th:text="#{email.password.expired.actions.title}">How to reset your password</h4>
        <ol style="font-size:15px; color:#444444; line-height:1.8; padding-left:20px; margin:0;">
            <li th:text="#{email.password.expired.actions.step1}">Visit the password reset page</li>
            <li th:text="#{email.password.expired.actions.step2}">Enter your email address</li>
            <li th:text="#{email.password.expired.actions.step3}">Follow the instructions in the reset email</li>
        </ol>
    </div>

    <!-- CTA Button -->
    <div style="text-align:center; margin:30px 0;">
        <div th:replace="~{emails/components/button :: button(text=#{email.password.expired.button}, url=${resetPasswordUrl})}"></div>
    </div>

    <!-- Footer info -->
    <p style="font-size:14px; color:#999999; text-align:center;">
        <span th:text="#{email.password.expired.sentAt} + ' ' + ${#dates.format(currentDate, 'MMMM dd, yyyy HH:mm z')}">Sent at: 2025-01-01 12:00</span>
    </p>

    <div th:replace="~{emails/components/support-card}"></div>
    <div th:replace="~{emails/components/signature}"></div>
</div>
</body>
</html>
