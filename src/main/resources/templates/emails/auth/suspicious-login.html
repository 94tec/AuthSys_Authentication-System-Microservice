<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/notification-template :: body(content=~{::#content})}">
<head><title>Suspicious Login Attempt</title></head>
<body>
    <div id="content">
        <div th:replace="~{emails/components/alert :: alert(type='danger', message='Suspicious activity detected on your account')}"></div>
        <p style="font-size:15px; color:#333333;">
            We blocked a login attempt that didn't match your usual pattern.
        </p>
        <div th:replace="~{emails/components/info-card :: info('Attempt Details', ${detailRows})}"></div>
        <p style="font-size:14px; color:#666666;">If this was you, you can safely ignore this. If not, secure your account immediately.</p>
        <div style="text-align:center; margin:20px 0 0;">
            <div th:replace="~{emails/components/button :: button(text='Secure My Account', url=${securityUrl}, style='danger')}"></div>
        </div>
    </div>
</body>
</html>
