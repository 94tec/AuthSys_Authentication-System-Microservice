<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layouts/notification-template :: body(content=~{::#content})}">
<head><title>New Login Detected</title></head>
<body>
    <div id="content">
        <div th:replace="~{emails/components/alert :: alert(type='info', message='New login to your account')}"></div>
        <p style="font-size:15px; color:#333333;">We noticed a new sign-in to your Damuchi account.</p>
        <div th:replace="~{emails/components/info-card :: info('Login Details', ${detailRows})}"></div>
        <p style="font-size:13px; color:#999999;">Not you? Secure your account right away.</p>
        <div style="text-align:center; margin:20px 0 0;">
            <div th:replace="~{emails/components/button :: button(text='Secure My Account', url=${securityUrl}, style='danger')}"></div>
        </div>
    </div>
</body>
</html>
