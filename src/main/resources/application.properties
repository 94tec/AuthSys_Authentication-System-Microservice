# Twilio Configuration

# Password policy configuration
security.password.policy.min-length=8
security.password.policy.require-upper=true
security.password.policy.require-special=true
security.password.policy.history-size=5

# Maximum registration attempts per hour from a single IP
security.registration.max-attempts-per-hour=5

# Maximum registration attempts per day from a single IP
security.registration.max-attempts-per-day=20

# How many hours to block an IP after exceeding limits
security.registration.block-duration-hours=24

# When to clean up old throttle records (3 AM daily)
security.registration.cleanup-cron=0 0 3 * * *

# Security
security.auth.max-attempts=5
security.auth.lockout-minutes=30
security.auth.timeout-seconds=10

# Rate limiting thresholds
security.rate-limiter.auth.max-per-minute=5
security.rate-limiter.auth.max-per-hour=20
security.rate-limiter.auth.ip-blacklist-duration=24
security.rate-limiter.auth.account-lock-threshold=5

# Cleanup schedule (3 AM daily)
security.rate-limiter.cleanup-cron=0 0 3 * * *

# Rate limiting thresholds
security.rate-limiter.max-attempts-per-minute=5
security.rate-limiter.max-attempts-per-hour=20
security.rate-limiter.cache-ttl-seconds=30
security.rate-limiter.cleanup-rate=60000
# Rate limiting configuration
security.rate-limit.global=1000
security.rate-limit.ipStandard=100
security.rate-limit.ipSensitive=30
security.rate-limit.windowMinutes=1

# Redis blacklist configuration
security.blacklist.prefix=blacklist:encrypted:
security.blacklist.default-ttl-hours=24

# Account lock settings
account.lock.max-attempts=5
account.lock.duration=30m
account.lock.failed-attempts-window=1h

# Password expiry settings (days)
security.password.expiry.days=90
security.password.warning.days=7

# Hibernate configuration
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.data.jpa.hibernate.use-new-id-generator-mappings=false

# Logging configuration

# Roles and Permissions
permissions.roles.ADMIN=READ,WRITE,DELETE,ADMIN
permissions.roles.MANAGER=READ,WRITE
permissions.roles.USER=READ

permissions.cache.someProperty=value

security.audit.retention-days=365
security.audit.purge-batch-size=1000

management.endpoints.web.exposure.include=auditevents,health,metrics

# Cache names managed by both Redis and Caffeine
spring.cache.cache-names=rolePermissions,effectivePermissions,userPermissions,users,usersByEmail,usersByStatus,activeSessions,deviceFingerprints,verificationTokens,passwordResetTokens,loginAttempts,rateLimits

spring.cache.caffeine.spec=recordStats
permissions.cache.ttl=300
permissions.cache.max-size=1000
# Redis cache key prefix (prevents collision with other apps)
spring.cache.redis.key-prefix=authSys:cache:

# Default Redis cache TTL (10 minutes)
spring.cache.redis.time-to-live=600000

# Enable cache statistics
spring.cache.redis.enable-statistics=true

# Optional WhatsApp integration credentials (keep values in environment variables).
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN:}


# Logging defaults are safe for production; enable targeted DEBUG only in local profile.
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.springframework.jdbc.core=INFO
logging.level.com.techStack.authSys.auth.firebase=INFO
logging.level.com.google.cloud.firestore=INFO
logging.level.com.google.cloud.spring.data.firestore=INFO