spring.application.name=authSys

# Local development is the safe default. Set SPRING_PROFILES_ACTIVE=prod on Render.
spring.profiles.default=local
server.port=${PORT:8001}

# application.properties
spring.cloud.gcp.firestore.enabled=true
spring.cloud.gcp.firestore.auto-create-fields=true

###spring.main.allow-circular-references=true

app.super-admin-email=mtengo0109@yahoo.com
# app.super-admin-email=m.damuchi.ke@gmail.com
app.super-admin-phone=+254718816690

enquiry.notification.internal-recipient=${ENQUIRY_INTERNAL_RECIPIENT:}

spring.config.import=classpath:permissions.yaml

#logging.level.root=DEBUG

threat.detection.api.key=${THREAT_DETECTION_API_KEY:}
threat.detection.api.url = https://api.virustotal.com/v3/urls

# ============================================================================
# FIREBASE CONFIGURATION
# ============================================================================

firebase.api.key=${FIREBASE_API_KEY:}
firebase.project-id=spring-data-a3ebb
encryption.secret-key=${ENCRYPTION_SECRET_KEY}

# Firebase HTTP Client Configuration
firebase.http.connect-timeout-ms=5000
firebase.http.response-timeout-seconds=5
firebase.http.read-timeout-seconds=5

# ============================================================================
# JWT CONFIGURATION
# ============================================================================

jwt.secret=${JWT_SECRET}
jwt.pepper=${JWT_PEPPER}
jwt.access=${JWT_ACCESS}
jwt.refresh=${JWT_REFRESH}
jwt.expiration.ms=3600000
jwt.access-token.expiration=3600
jwt.refresh.expiration.ms=2592000000
jwt.email-verification.expiration=1800
jwt.clock.skew.seconds=60
jwt.issuer=techStack-auth

# ============================================================================
# EMAIL CONFIGURATION
# ============================================================================

# ============================================================
# NOTIFICATION CONFIGURATION
# ============================================================

notification.brevo.enabled=${BREVO_ENABLED:true}
notification.brevo.api-key=${BREVO_API_KEY:}
notification.brevo.sender-email=${BREVO_SENDER_EMAIL:info@kivanasafaris.com}
notification.brevo.sender-name=${BREVO_SENDER_NAME:Kivana Trails and Safaris}

# Notification retry policy
notification.retry.max-attempts=3
notification.retry.window-hours=24

# ============================================================================
# REDIS CONFIGURATION
# ============================================================================

spring.cache.type=redis

# Redis Cache Configuration
spring.redis.cache.ttl-minutes=10

# ============================================================================
# POSTGRES CONFIGURATION
#

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

app.logo-url=static/images/logo.png

# SMTP Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}

# Timeout Configuration (milliseconds)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

