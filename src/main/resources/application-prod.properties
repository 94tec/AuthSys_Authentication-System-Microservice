
# Render supplies PORT; do not hard-code 8001 in production
server.port=${PORT:10000}

# PostgreSQL supplied by Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false

# Reduce noisy production logs
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.techStack.authSys.auth.firebase=INFO

# Frontend URLs - update after Vercel deployment
app.frontend-base-url=${FRONTEND_BASE_URL}
app.login-url=${FRONTEND_BASE_URL}/login
app.base-url=${BACKEND_BASE_URL}

# CORS: comma-separated list, no spaces
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Redis - use Render Redis or another managed Redis provider
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ===============================
# JWT Configuration
# ===============================

# Secret keys (Overridden safely by platform environment variables in production)
jwt.secret=${JWT_BASE_SECRET}
jwt.pepper=${JWT_PEPPER}
jwt.access=${JWT_ACCESS_SECRET}
jwt.refresh=${JWT_REFRESH_SECRET}

# Expirations
jwt.expiration-ms=${JWT_GLOBAL_EXPIRATION:3600000}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION_SECS:3600}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
jwt.email-verification-expiration=${JWT_EMAIL_EXPIRATION_SECS:1800}

# Validation configs
jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECS:30}
jwt.issuer=${JWT_ISSUER_NAME:techStack-auth}
