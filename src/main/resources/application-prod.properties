# Production profile for Render. Required values are supplied in Render Environment.
server.port=${PORT:10000}

# Render PostgreSQL: SPRING_DATASOURCE_URL must be JDBC format, e.g. jdbc:postgresql://HOST:5432/DB
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production Redis-compatible service. Set REDIS_SSL=true if the provider requires TLS.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000}
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.shutdown-timeout=100ms
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.redis.lettuce.pool.test-on-borrow=true
spring.redis.lettuce.pool.test-while-idle=true
spring.cache.type=redis

# Set this to the mounted Render Secret File path, e.g. /etc/secrets/firebase-service-account.json
firebase.service-account.path=${FIREBASE_SERVICE_ACCOUNT_PATH}

# Deployed public URLs and exact allowed origins. Do not use wildcard origins with credentials.
app.base-url=${APP_BASE_URL}
app.frontend-base-url=${FRONTEND_BASE_URL}
app.login-url=${APP_LOGIN_URL}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Production security settings; validate compatibility with your admin MFA/IP workflows before rollout.
security.admin.require-mfa=${ADMIN_REQUIRE_MFA:true}
security.ip-validation.enabled=${SECURITY_IP_VALIDATION_ENABLED:false}
spring.mail.test-connection=${MAIL_TEST_CONNECTION:false}

# Never emit SQL statements or bound parameter values in production logs.
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.jdbc.core=WARN
logging.level.com.techStack.authSys.auth.firebase=INFO
logging.level.com.google.cloud.firestore=WARN
logging.level.com.google.cloud.spring.data.firestore=WARN